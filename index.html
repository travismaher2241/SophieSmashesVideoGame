<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>">
    <title>SOPHIE GOLF — Warragul Country Club Hole 6</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b1d0c;
        font-family: 'Courier New', Courier, monospace;
        color: #e0f0e0;
      }
      #game-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #render-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0c1a0e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        color: #55ff55;
      }
      #loading-screen h1 {
        font-size: 2rem;
        letter-spacing: 4px;
        margin-bottom: 12px;
        text-shadow: 2px 2px #003300;
      }
      #loading-screen p {
        font-size: 1rem;
        color: #a0dba0;
      }
      #error-modal {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #330000;
        border: 3px solid #ff3333;
        color: #ffcccc;
        padding: 24px;
        max-width: 600px;
        z-index: 200;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      }
      #error-modal h2 {
        color: #ff6666;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="loading-screen">
        <h1>SOPHIE GOLF</h1>
        <p>Loading Warragul DEM terrain...</p>
      </div>

      <div id="error-modal">
        <h2 id="error-title">TERRAIN LOAD ERROR</h2>
        <p id="error-message"></p>
      </div>

      <canvas id="render-canvas"></canvas>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
